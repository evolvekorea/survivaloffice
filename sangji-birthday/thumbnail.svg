<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">상지야 생일 축하해</title>
  <desc id="desc">분홍색 생일 케이크와 촛불이 그려진 축하 카드</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7d8"/><stop offset=".5" stop-color="#ffe5ef"/><stop offset="1" stop-color="#e9e1ff"/></linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9ab7"/><stop offset="1" stop-color="#ff729e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#7a4569" flood-opacity=".18"/></filter>
  </defs>
  <rect width="800" height="800" rx="72" fill="url(#bg)"/>
  <circle cx="95" cy="120" r="50" fill="#ffd968" opacity=".55"/><circle cx="720" cy="180" r="75" fill="#bca8ef" opacity=".35"/>
  <g fill="#ff7da4"><path d="M125 220l10 25 25 10-25 10-10 25-10-25-25-10 25-10z"/><path d="M680 340l8 19 19 8-19 8-8 19-8-19-19-8 19-8z" opacity=".7"/></g>
  <text x="400" y="130" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#ed4e82">HAPPY BIRTHDAY</text>
  <text x="400" y="225" text-anchor="middle" font-family="sans-serif" font-size="70" font-weight="800" fill="#432f4c">상지야, 생일 축하해!</text>
  <g filter="url(#shadow)" transform="translate(0 30)">
    <ellipse cx="400" cy="665" rx="210" ry="34" fill="#cfc1ef" stroke="#745d7e" stroke-opacity=".15" stroke-width="6"/>
    <rect x="220" y="455" width="360" height="190" rx="25" fill="url(#cake)" stroke="#745d7e" stroke-opacity=".13" stroke-width="6"/>
    <ellipse cx="400" cy="458" rx="180" ry="55" fill="#fff8ea" stroke="#745d7e" stroke-opacity=".13" stroke-width="6"/>
    <text x="400" y="560" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="900" fill="white">상지의 빛나는 오늘</text>
    <g stroke="#745d7e" stroke-opacity=".13" stroke-width="4">
      <rect x="285" y="336" width="24" height="102" rx="9" fill="#ff7da4"/><rect x="343" y="320" width="24" height="118" rx="9" fill="#ffd968"/><rect x="401" y="330" width="24" height="108" rx="9" fill="#8ddbc2"/><rect x="459" y="316" width="24" height="122" rx="9" fill="#bca8ef"/><rect x="517" y="338" width="24" height="100" rx="9" fill="#70bce7"/>
    </g>
    <g fill="#ff9b3c">
      <path d="M297 326c-21-18 0-43 0-43s21 25 0 43z"/><path d="M355 310c-21-18 0-43 0-43s21 25 0 43z"/><path d="M413 320c-21-18 0-43 0-43s21 25 0 43z"/><path d="M471 306c-21-18 0-43 0-43s21 25 0 43z"/><path d="M529 328c-21-18 0-43 0-43s21 25 0 43z"/>
    </g>
  </g>
  <text x="400" y="750" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#876f8e">오늘 하루 세상에서 제일 행복하기</text>
</svg>
