  <div id="app" aria-live="polite">
    <!-- 1) 시작 화면 -->
    <section id="start-screen" class="screen active" aria-label="시작 화면">
      <img
        src="https://www.survivaloffice.com/images/fall.png"
        width="360"
        height="550"
        alt="테스트 시작 이미지"
        class="background-img"
        decoding="async"
        loading="eager"
      />

      <!-- 참여자 수 배지 -->
      <div
        id="test-counter"
        class="counter-badge"
        data-counter-namespace="survivaloffice"
        data-counter-key="fall"
        aria-live="polite"
      >
        총 0명 참여
      </div>

      <div class="start-btn-container">
        <button id="start-btn" type="button" class="primary">테스트 하기</button>
      </div>
    </section>

    <!-- 2) 성별 선택 -->
    <section id="gender-screen" class="screen" aria-label="성별 선택">
      <div class="gender-container" role="group" aria-label="성별 선택 그룹">
        <button id="male-btn" type="button" class="gender-box">👨 남자</button>
        <button id="female-btn" type="button" class="gender-box">👩 여자</button>
      </div>
    </section>

    <!-- 3) 질문 화면 -->
    <section id="quiz-screen" class="screen" aria-label="질문 화면">
      <!-- 진행바 -->
      <div class="progress-wrap" aria-label="진행도">
        <div
          id="progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
          aria-label="문항 진행도"
        >
          <div id="progress-fill"></div>
          <div id="progress-count" aria-hidden="true">0 / 10</div>
        </div>
      </div>

      <div class="question-box">
        <p id="question-text"></p>
      </div>

      <div class="choices" role="group" aria-label="선택지">
        <!-- 기본값 O/X (script.js에서 텍스트 교체 가능) -->
        <button id="choice-a" type="button" class="choice-btn">O</button>
        <button id="choice-b" type="button" class="choice-btn">X</button>
      </div>
    </section>

    <!-- 4) 결과 화면 -->
    <section id="result-screen" class="screen" aria-label="결과 화면">
      <article class="result-card">
        <header class="result-header">
          <h2 id="result-title">가을 지수</h2>
          <div class="result-score-wrap">
            <div id="result-percent" class="result-percent" aria-live="polite">0%</div>
            <div class="result-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="result-bar-fill"></div>
            </div>
          </div>
        </header>
        <section class="result-body">
          <h3 id="result-name" class="result-name">가을 감성 수줍은 다람쥐</h3>
          <p id="result-description" class="result-description">
            점수를 확인하면 가을 감성에 딱 맞는 설명이 여기에 표시됩니다.
          </p>
        </section>
      </article>
    </section>

  <!-- 하단 액션 영역 -->
